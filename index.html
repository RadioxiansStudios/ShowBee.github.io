<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowBee Engine | Advanced Automation</title>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --accent: #58a6ff; --text: #c9d1d9; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui; height: 100vh; display: flex; flex-direction: column; }
        
        /* Top Navigation */
        header { height: 50px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .logo { font-weight: 800; color: var(--accent); letter-spacing: -1px; }
        
        /* Main Layout */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar Components */
        .sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .tool-group { padding: 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .tool-group:hover { background: #1f242c; border-color: var(--accent); }
        
        /* Main Area */
        .main-canvas { flex: 1; background: radial-gradient(#1f242c 1px, transparent 1px); background-size: 20px 20px; position: relative; }
        
        /* Right Inspector Panel */
        .inspector { width: 300px; background: var(--panel); border-left: 1px solid var(--border); padding: 15px; }
        
        /* Bottom Console */
        .console { height: 180px; background: #000; border-top: 1px solid var(--border); padding: 15px; overflow-y: auto; font-family: 'Cascadia Code', monospace; font-size: 0.85rem; color: #4af626; }
    </style>
</head>
<body>

    <header>
        <div class="logo">SHOWBEE ENGINE v2.0</div>
        <div>
            <button onclick="engine.run()">Execute Sequence</button>
            <button onclick="engine.clear()">Clear</button>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar" id="module-palette">
            <h3>Available Modules</h3>
            <div class="tool-group" draggable="true">File Input</div>
            <div class="tool-group" draggable="true">Data Parser</div>
            <div class="tool-group" draggable="true">Cloud Sync</div>
            <div class="tool-group" draggable="true">Notification</div>
        </aside>

        <section class="main-canvas" id="canvas"></section>

        <aside class="inspector">
            <h3>Properties</h3>
            <div id="prop-editor">Select a node to edit</div>
        </aside>
    </div>

    <div class="console" id="log-output">
        [SYSTEM] ShowBee Engine Initialized...
    </div>

    <script src="engine.js"></script>
</body>
</html>
